<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web App ของฉัน</title>
    <style>
        /* ตั้งค่าให้หน้าเว็บหลักเต็มจอ 100% ไม่มีขอบขาวล้น */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* ซ่อนแถบเลื่อนซ้อนทับ */
            background-color: #ffffff;
        }
        /* ตั้งค่าให้ iframe ขยายเต็มหน้าจอมือถือและคอมพิวเตอร์โดยอัตโนมัติ */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe src="https://script.google.com/macros/s/AKfycbwf4dY-AWXCVHgD1T-t74G-oGfOoSYUGP-Mm9QYy-zY5Eg0KTWXoeKYy7GYkjm-Z5WqmQ/exec"></iframe>

</body>
</html>
